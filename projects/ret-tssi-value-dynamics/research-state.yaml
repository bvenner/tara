  open_problems:
    - "TSSI lacks a rigorous disequilibrium-dynamics framework (Veneziani 2005 critique)"
    - "No hyperbolic/relaxation treatment of value-price equilibration exists in the literature"
    - "Categorical foundations (Baez-Lynch-Moeller) cover equilibrium thermostatics only; non-equilibrium/extended case is open"
    - "No unified account of the Coleman-Noll vs Müller-Liu entropy-exploitation procedures"
  evidence_gaps:
    - "No empirical estimates of value-price relaxation times"
    - "Gravitation literature (cross-dual dynamics) has mixed convergence results without a unifying stability criterion"

hypotheses:
  - id: H1
    statement: "TSSI value-price dynamics can be written as a system of hyperbolic balance laws with Cattaneo-type relaxation of intersectoral capital fluxes."
  - id: H2
    statement: "The system admits a convex entropy extension, hence symmetric-hyperbolic form and a well-posed Cauchy problem (Ruggeri-Strumia mechanism)."
  - id: H3
    statement: "Under a Shizuta-Kawashima-type coupling condition, the production-price equilibrium is asymptotically stable; failure of the condition explains known non-convergence results."
  - id: H4
    statement: "The simultaneist (Sraffian dual-system) determination emerges as the tau -> 0 relaxation (singular) limit of the temporal system."

