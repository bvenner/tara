# Research State — Central Project Tracking
project:
  title: "Rational extended thermodynamics as a formal framework for the temporal single-system interpretation of the transformation problem"
  question: "Can the temporal single-system interpretation (TSSI) of Marxian value theory be given a rigorous dynamical foundation by formal analogy with rational extended thermodynamics (RET) — specifically, the hyperbolization of parabolic transport equations via relaxation of fluxes to state variables?"
  status: active
  started: "2026-08-15"
  domain: "Marxian econophysics / applied mathematics"
  deliverables:
    primary: "program/research-program.md (Ph.D.-scale research program)"
    phase2: "proposal/masters-proposal.md (6-month Master's thesis exposé; sub-problem TBD after program review)"

